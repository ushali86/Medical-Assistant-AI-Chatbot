<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MedAssist AI Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link rel="stylesheet" href="/style.css">

</head>

<body class="bg-light">

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            🏥 MedAssist AI
        </a>

        <div class="ms-auto">

            <span class="text-white me-3">
                Welcome,
                <span id="userName">
                    User
                </span>
            </span>

            <button class="btn btn-light btn-sm"
                    id="logoutBtn">

                Logout

            </button>

        </div>

    </div>

</nav>

<!-- Main Container -->

<div class="container mt-5">

    <!-- Welcome Card -->

    <div class="card shadow border-0 mb-4">

        <div class="card-body">

            <h2 class="fw-bold">

                👋 Welcome to MedAssist AI

            </h2>

            <p class="text-muted">

                Your Personal AI Healthcare Assistant

            </p>

        </div>

    </div>

    <!-- Feature Cards -->

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card shadow h-100">

                <div class="card-body text-center">

                    <i class="bi bi-robot display-4 text-primary"></i>

                    <h4 class="mt-3">

                        AI Chat

                    </h4>

                    <p>

                        Ask health related questions instantly.

                    </p>

                    <a href="/chat.html"
                       class="btn btn-primary">

                        Open

                    </a>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow h-100">

                <div class="card-body text-center">

                    <i class="bi bi-calendar-check display-4 text-success"></i>

                    <h4 class="mt-3">

                        Appointment

                    </h4>

                    <p>

                        Book appointments with doctors.

                    </p>

                    <button class="btn btn-success">

                        Book Now

                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card shadow h-100">

                <div class="card-body text-center">

                    <i class="bi bi-file-earmark-medical display-4 text-danger"></i>

                    <h4 class="mt-3">

                        Prescriptions

                    </h4>

                    <p>

                        View your medical prescriptions.

                    </p>

                    <button class="btn btn-danger">

                        View

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

const name =
localStorage.getItem("user_name");

if(name){

document.getElementById("userName").innerText=name;

}

document
.getElementById("logoutBtn")
.onclick=function(){

localStorage.clear();

window.location.href="/login.html";

};

</script>

</body>

</html>
